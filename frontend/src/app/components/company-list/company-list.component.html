<div class="container">
  <h1>🏢 Company Screener</h1>

  <input
    class="search-input"
    type="text"
    placeholder="Search by name or sector..."
    [ngModel]="searchTerm()"
    (ngModelChange)="searchTerm.set($event)"
  />

  <div *ngIf="loading()" class="loading">Loading companies...</div>
  <div *ngIf="error()" class="error">{{ error() }}</div>

  <table *ngIf="!loading() && !error()">
    <thead>
      <tr>
        <th>Name</th>
        <th>Sector</th>
        <th>Country</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let company of filtered()">
        <td>{{ company.name }}</td>
        <td>{{ company.sector }}</td>
        <td>{{ company.country }}</td>
        <td>
          <a [routerLink]="['/company', company.id]" class="btn-view">View</a>
        </td>
      </tr>
      <tr *ngIf="filtered().length === 0">
        <td colspan="4" class="no-results">No companies match your search.</td>
      </tr>
    </tbody>
  </table>
  <app-sector-chart></app-sector-chart>
</div>
