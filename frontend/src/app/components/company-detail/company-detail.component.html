<div class="page">
  <a class="back-link" routerLink="/">← Back to companies</a>

  <div *ngIf="pageError()" class="error-msg">{{ pageError() }}</div>

  <div *ngIf="company() as c">
    <div class="detail-header">
      <div class="detail-header-left">
        <div class="detail-avatar" [ngStyle]="avatarStyle(c.sector)">
          {{ initials(c.name) }}
        </div>
        <div class="detail-title">
          <h1>{{ c.name }}</h1>
          <div class="badges">
            <span class="badge" [ngStyle]="pillStyle(c.sector)">{{ c.sector }}</span>
            <span class="badge" style="background:#f3f4f6;color:#374151">📍 {{ c.country }}</span>
          </div>
        </div>
      </div>
      <button
        class="btn-watch"
        [class.watched]="watchlistService.isWatched(c.id)"
        (click)="watchlistService.isWatched(c.id) ? watchlistService.remove(c.id) : watchlistService.add(c)">
        {{ watchlistService.isWatched(c.id) ? '★ Saved' : '☆ Add to watchlist' }}
      </button>
    </div>

    <div class="info-grid">
      <div class="info-card">
        <div class="info-label">Founded</div>
        <div class="info-value">{{ c.foundedYear }}</div>
      </div>
      <div class="info-card">
        <div class="info-label">Employees</div>
        <div class="info-value">{{ c.employeeCount | number }}</div>
      </div>
    </div>

    <p class="description">{{ c.description }}</p>

    <div class="ai-box">
      <h2>🤖 Ask AI about {{ c.name }}</h2>
      <div class="ai-input-row">
        <input
          type="text"
          placeholder="e.g. What does this company do?"
          [ngModel]="question()"
          (ngModelChange)="question.set($event)"
          (keyup.enter)="askQuestion()"
        />
        <button (click)="askQuestion()" [disabled]="aiLoading()">
          {{ aiLoading() ? 'Asking...' : 'Ask' }}
        </button>
      </div>
      <div *ngIf="aiLoading()" class="ai-loading">⏳ Waiting for AI response...</div>
      <div *ngIf="aiError()" class="error-msg">{{ aiError() }}</div>
      <div *ngIf="answer()" class="ai-answer">{{ answer() }}</div>
    </div>
  </div>
</div>
